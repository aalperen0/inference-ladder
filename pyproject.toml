[project]
name = "inference-ladder"
version = "0.1.0"
description = "GPT-2 inference from scratch, one rung at a time: KV cache, prefill vs decode, batching."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "tiktoken",
    "matplotlib",
    "numpy",
    "tqdm",
    "huggingface_hub",
    "safetensors",
    # the HTTP server (server/api.py), and the load client and its tests
    "fastapi",
    "uvicorn",
    "httpx",
    # only as the parity reference in tests/
    "transformers",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["gpt", "server", "bench"]
